# Divergences between pelicanfs_native and pelicanfs.
#
# This file is the register of every place the two implementations
# disagree about the same operation against the same federation. It is
# the single source of truth: test/test_differential.py loads it and
# uses `summary` as the reason on an xfail(strict=True), so an entry
# cannot drift away from the test that pins it, and
# test_register_has_no_stale_entries fails if an entry stops being used.
#
# Because the xfails are strict, the suite stays green while a
# divergence lasts and fails the day it is fixed -- which is the signal
# to delete the entry.
#
# Fields:
#   summary  one paragraph: what differs, and which side we believe.
#   blame    "pelicanfs", "pelicanfs-native", "upstream" or "undecided".
#   found    ISO date the oracle first reported it.
#   evidence how to see it, beyond the test that pins it.

[info-is-stateful]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
The first pelicanfs info() on a filesystem instance succeeds and every \
later one on that instance raises FileNotFoundError. Each object stats \
fine as the first call on a genuinely fresh instance and fails as the \
second, so the state is per-instance: the first call caches a resolved \
endpoint URL that is then reused for unrelated paths -- the same \
endpoint path info() hands back as the object's name. This bites every \
real caller, because fsspec keys its instance cache on the storage \
options and hands the same PelicanFileSystem to everyone using the same \
federation. The most serious finding here.\
"""
evidence = """
Run test_info_agrees_on_size for one object at a time and each passes; \
run them together against a shared instance and all but the first fail. \
A fresh instance needs skip_instance_cache=True, or fsspec returns the \
same object and "fresh" means nothing.\
"""

[info-name-is-the-endpoint-path]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs.info() returns the name it was ANSWERED from -- \
'/api/v1.0/origin/data/ns/obj' -- rather than the namespace path \
'/ns/obj' the caller asked for. That name cannot be handed back to \
open() or ls(), which the fsspec contract requires.\
"""
evidence = """
The Go client's stat echoes the same endpoint path, so this is an \
upstream wart that pelicanfs passes through and pelicanfs_native \
normalizes; see _entry in core.py. test_info_name_is_addressable pins \
the property that matters.\
"""

[ls-crashes-on-a-subcollection]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs._ls_real calls int(item['size']) on every entry, and a \
collection's PROPFIND size property is empty, so ls(detail=True) \
raises ValueError: invalid literal for int() with base 10: ''. \
Originally read as "a collection containing a subdirectory"; the \
fuzzer sharpened it to EVERY collection, because the listing also \
echoes the collection itself (see ls-echoes-the-collection-itself) and \
that entry is a collection whatever it contains. ls(detail=False) \
survives, since the size is only parsed for the detailed form. The \
native side lists either way.\
"""
evidence = """
ls('/ns/subdir', detail=True) raises even though subdir holds one \
file and no subdirectory; ls('/ns/subdir', detail=False) returns a \
list. find() and walk() go through the detailed form.\
"""

[info-type]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs.info() hardcodes type='file' and never reports a collection, \
while the native client carries IsCollection through.\
"""
evidence = "info() on a directory returns type='file'."

[info-mtime-shape]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs reports mtime as an unparsed string from info() and as a \
datetime under the key 'modified' from ls(); the native side reports an \
int epoch. fsspec does not pin the encoding, but one class should not \
use two shapes for one field.\
"""
evidence = "Compare info() and ls() output for the same object."

[range-entirely-past-eof]
blame = "undecided"
found = "2026-11-05"
summary = """
A read whose whole range lies past the end of the object: the native \
client returns b'', pelicanfs raises. fsspec does not pin this -- HTTP \
answers 416 while a local filesystem returns b'' -- so this one needs a \
decision before either side is called wrong.\
"""
evidence = "cat_file(path, 10000, 10010) on a 13-byte object."

# --------------------------------------------------------------------- #
# Found by the generative path fuzzer (test/test_fuzz_paths.py)         #
# --------------------------------------------------------------------- #

[osdf-two-slash-form-is-normalized]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs runs the sloppy two-slash form 'osdf://ns/obj' -- and only \
that form -- through PurePosixPath, which collapses '.' segments and \
repeated separators, so 'osdf://ns/./obj' and 'osdf://ns//obj' both \
denote '/ns/obj'. The three-slash 'osdf:///ns/./obj' and every \
'pelican://' spelling are passed through untouched, so one library \
gives one object name two different normalizations depending on how \
many slashes the caller typed. The native side never rewrites a \
namespace path: the federation decides what '//' and '.' mean, not the \
client.\
"""
evidence = """
_check_fspath in pelicanfs/core.py: the osdf branch builds \
str(PurePosixPath("/" + parsed.netloc + parsed.path)); no other branch \
does. Over 150000 generated spellings this was the only unexplained \
class of disagreement the direct front door produced.\
"""

[strip-protocol-loses-the-osdf-federation]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
pelicanfs has two path front doors that do not compose. \
_check_fspath() reads 'osdf://ns/obj' as the OSDF federation and the \
path '/ns/obj'; _strip_protocol() -- which fsspec's glob() and open() \
call -- just removes the scheme, leaving 'ns/obj', which _check_fspath \
then reads as the HOST 'ns'. So the same URL means a different \
federation depending on which method the caller used: info() goes to \
OSDF, glob() goes to a federation named after the first path \
component, or raises InvalidMetadata if the filesystem is already \
bound elsewhere. The native _strip_protocol returns a rooted namespace \
path and is idempotent, so its two doors agree.\
"""
evidence = """
PelicanFileSystem._strip_protocol('osdf://ns/obj') == 'ns/obj'; \
feeding that back into _check_fspath yields path '/obj' on federation \
'pelican://ns/'. test_native_path_front_doors_compose is the control \
on the other side.\
"""

[strip-protocol-rejects-a-port]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
The same non-composing front doors, with a sharper edge: \
_strip_protocol('pelican://host:8443/ns/obj') returns \
'host:8443/ns/obj', and urlparse reads 'host' as a scheme, so \
_check_fspath raises InvalidDestinationURL("Invalid scheme: host"). \
Every pelicanfs method that strips first therefore fails against any \
federation whose discovery URL carries a port -- glob() is the one in \
the public API, and the same applies to a userinfo form such as \
pelican://user:pass@host/. A federation on a non-default port is \
normal in testing and not unusual in production.\
"""
evidence = """
glob() on the test federation, which runs on an ephemeral port: \
pelicanfs raises while the native client lists the objects. See \
test_glob_agrees_on_a_ported_federation.\
"""

[path-rejection-exception-class]
blame = "undecided"
found = "2026-11-05"
summary = """
Refusing a path raises from unrelated hierarchies: the native side \
raises ValueError, as fsspec backends and the standard library do for \
a malformed argument, while pelicanfs raises PelicanException, which \
derives from RuntimeError. A caller handling both implementations \
cannot write one except clause. Which one is right is a judgement \
call, so this is undecided rather than blamed -- but they should not \
both stand.\
"""
evidence = """
_check_fspath('s3://bucket/key') raises InvalidDestinationURL; \
_split_url on the same string raises ValueError. The fuzzer's oracle \
absorbs this deliberately, or it would mask every other rejection \
difference.\
"""

[url-with-no-path-is-empty]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
'pelican://host', a URL with no path component, denotes the federation \
root. pelicanfs's _check_fspath returns '' for it, and that empty \
string is then concatenated into a director URL and matched against \
namespace prefixes; the native side returns '/'. Adding the trailing \
slash by hand ('pelican://host/') gives '/' from both, so the two \
spellings of the root disagree with each other inside one library.\
"""
evidence = """
_check_fspath('pelican://host') == '' while \
_check_fspath('pelican://host/') == '/'. The fuzzer's canonical() \
folds a trailing separator away on both sides, so only the dedicated \
pin sees this.\
"""

# --------------------------------------------------------------------- #
# Found by the federation-backed fuzzer (test/test_fuzz_operations.py)  #
# --------------------------------------------------------------------- #

[range-start-before-the-beginning]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
fsspec documents cat_file's start and end as Python slice bounds, and \
a slice clamps: data[-20:-5] on 13 bytes is data[0:8]. The native \
client clamps the same way. pelicanfs turns the resolved offset into \
an HTTP Range header without clamping, the origin answers 416 and \
aiohttp raises ClientResponseError.

Negative offsets are NOT the problem, which is worth stating because \
the first reading of the sweep said they were: cat_file(path, -5, -1) \
works on both. It is specifically a start that resolves below zero, \
i.e. a negative start further back than the object is long -- which is \
what a caller computing "the last N bytes" of an object smaller than N \
produces.\
"""
evidence = """
cat_file(path, -20, -5) on the 13-byte hello_world.txt: b'Hello, W' \
natively, 416 on pelicanfs. 22 of the 169 (start, end) pairs swept \
over [None, -20, -14, -13, -5, -1, 0, 1, 5, 12, 13, 14, 20] fail this \
way; see docs/FUZZER-NOTES.md.\
"""

[inverted-or-empty-range]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
An INVERTED range -- cat_file(path, 5, 1), where the end resolves \
below the start -- is b'' under slice semantics and that is what the \
native client returns. pelicanfs builds 'bytes=5-0' and the origin \
answers 416. A caller computing a range arithmetically hits this case \
routinely, and a range that selects nothing is not an error.

A range whose bounds are merely EQUAL is not part of this: \
cat_file(path, 5, 5) and cat_file(path, 0, 0) both return b'' from \
both libraries. An earlier wording of this entry claimed they raised; \
re-running the three pairs against pelicanfs 1.5.0 shows only the \
inverted one does.\
"""
evidence = """
cat_file(path, 5, 1) on the 13-byte hello_world.txt raises \
ClientResponseError 416 on pelicanfs and returns b'' natively; \
cat_file(path, 5, 5) and cat_file(path, 0, 0) agree on b''.\
"""

[exists-raises-on-an-unusable-path]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
exists() asks a question and should answer it. fsspec's \
AbstractFileSystem.exists catches everything and returns False, which \
the native side inherits; pelicanfs overrides _exists and lets \
_check_fspath's InvalidDestinationURL escape. So a caller sweeping a \
list of candidate paths gets False from one spelling and an exception \
from the next, for inputs that are equally unusable. Both libraries \
agree the path names nothing -- they differ only in how exists() says \
so, which is the part fsspec pins.\
"""
evidence = """
exists('s3://bucket/key') returns False natively and raises \
InvalidDestinationURL on pelicanfs. The fuzzer found it through the \
schemeless host-first form against the test federation, whose \
ephemeral port makes 'localhost:63371/ns/obj' parse as a URL with the \
scheme 'localhost' -- a form both libraries document and neither can \
then address, which is a separate, shared wart.\
"""

[ls-names-are-endpoint-paths]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
ls(detail=False) names every entry by the resolved origin endpoint \
path -- '/api/v1.0/origin/data/ns/obj' -- instead of the namespace \
path '/ns/obj'. fsspec requires that a name ls() returns can be handed \
straight back to open() or info(), and these cannot. Same root cause \
as info-name-is-the-endpoint-path, recorded separately because it is a \
different method, reached by a different code path, and pinned by a \
different test; fixing one need not fix the other.\
"""
evidence = """
ls('/test-namespace/subdir', detail=False) returns \
['/api/v1.0/origin/data/test-namespace/subdir/', \
'/api/v1.0/origin/data/test-namespace/subdir/nested.txt'].\
"""

[ls-echoes-the-collection-itself]
blame = "pelicanfs"
found = "2026-11-05"
summary = """
A listing includes the collection that was listed, so ls('/ns/subdir') \
returns '/ns/subdir/' alongside its contents. That is the raw WebDAV \
PROPFIND Depth:1 shape passed through; fsspec's ls() is the contents \
of a directory, and the native side drops the self-entry for the \
stated reason that find() and walk() would otherwise recurse forever. \
It is also what makes ls-crashes-on-a-subcollection fire on every \
collection rather than only nested ones.\
"""
evidence = """
ls('/test-namespace/subdir', detail=False) on an export whose subdir \
holds exactly one file returns two entries.\
"""
